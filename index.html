<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A precise, local-first world clock board. Compare times, select any moment, and measure durations across time zones."
    />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>World Clock</title>
    <script>
      (() => {
        try {
          const raw = localStorage.getItem('world-clock');
          const payload = raw ? JSON.parse(raw) : null;
          const settings = payload && payload.settings ? payload.settings : {};
          const themes = ['system', 'light', 'dark'];
          const accents = ['blue', 'teal', 'violet', 'amber', 'rose', 'green'];
          const theme = themes.includes(settings.theme) ? settings.theme : 'system';
          const accent = accents.includes(settings.accent) ? settings.accent : 'blue';
          const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          const resolved = theme === 'system' ? (prefersDark ? 'dark' : 'light') : theme;
          document.documentElement.dataset.theme = resolved;
          document.documentElement.dataset.accent = accent;
        } catch {
          document.documentElement.dataset.theme = 'light';
          document.documentElement.dataset.accent = 'blue';
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
