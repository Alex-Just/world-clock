    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "World Clock",
        "url": "https://alex-just.github.io/world-clock/",
        "description": "A precise, local-first world clock board for desktop and mobile. Compare times across time zones, select any moment, and measure durations with working-hours availability. Free, private, and no sign-up.",
        "applicationCategory": "UtilitiesApplication",
        "operatingSystem": "Any",
        "browserRequirements": "Requires JavaScript and a modern browser",
        "isAccessibleForFree": true,
        "inLanguage": "en",
        "image": "https://alex-just.github.io/world-clock/og-image.png",
        "license": "https://opensource.org/license/mit",
        "sameAs": ["https://github.com/Alex-Just/world-clock"],
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        },
        "featureList": [
          "Any number of IANA time zones on one continuous day axis",
          "Precise local day periods and working-hours availability",
          "Seven-day strip and month calendar with a date jump",
          "Focus by click, tap, drag, keyboard, exact wall time, or relative offset",
          "Range duration, wall-clock duration across DST, and per-zone availability",
          "Light, dark, and system themes with six accents",
          "Local-first data with JSON export and import"
        ]
      }
    </script>

    <script>
      (() => {
        try {
          const raw = localStorage.getItem('world-clock');
          const payload = raw ? JSON.parse(raw) : null;
          const settings = payload && payload.settings ? payload.settings : {};
          const themes = ['system', 'light', 'dark'];
          const accents = ['blue', 'teal', 'violet', 'amber', 'rose', 'green'];
          const theme = themes.includes(settings.theme) ? settings.theme : 'system';
          const accent = accents.includes(settings.accent) ? settings.accent : 'blue';
          const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          const resolved = theme === 'system' ? (prefersDark ? 'dark' : 'light') : theme;
          document.documentElement.dataset.theme = resolved;
          document.documentElement.dataset.accent = accent;
        } catch {
          document.documentElement.dataset.theme = 'light';
          document.documentElement.dataset.accent = 'blue';
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>
      <main>
        <h1>World Clock</h1>
        <p>
          A precise, local-first world clock board. Compare times across time zones, pick any
          moment, and measure durations. Enable JavaScript to use the interactive board.
        </p>
      </main>
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
